[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silo-creator-corpus"
version = "0.1.0"
description = "Versioned Douyin creator corpus and style distillation service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "playwright>=1.55,<2",
  "uvicorn[standard]>=0.30,<1",
  "douyin-downloader @ git+https://github.com/jiji262/douyin-downloader.git@9b3b6f1fec09c847f94a95aae16b52ab3bad5f12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
